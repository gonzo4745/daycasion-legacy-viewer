<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://zwitjkrmzkvrektahuml.supabase.co 'self'; img-src https://zwitjkrmzkvrektahuml.supabase.co blob: data:; media-src https://zwitjkrmzkvrektahuml.supabase.co blob:; base-uri 'none'; form-action 'none'">
<title>DayCasion Legacy</title>
<!-- Frame guard: GitHub Pages can't send X-Frame-Options, so the page stays hidden unless it is the top window. -->
<style id="dc-frame-guard">html { display: none !important; }</style>
<style>
  :root { --bg:#f7f4ef; --card:#ffffff; --text:#1f1d1a; --muted:#6b655d; --line:#e6e0d6; --accent:#8a6d3b; --err:#a3312a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161513; --card:#201e1b; --text:#f1ece4; --muted:#a59d92; --line:#34302a; --accent:#d2b07a; --err:#e07a72; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  .brand { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: 32px; line-height: 1.25; margin: 6px 0 4px; }
  h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: 24px; margin: 0 0 12px; }
  h3 { font-size: 16px; margin: 0 0 6px; }
  .muted { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; margin-top: 20px; }
  .eulogy p { font-family: Georgia, "Times New Roman", serif; font-size: 18px; line-height: 1.75; margin: 0 0 1em; }
  #video-eulogy video { width: 100%; max-height: 70vh; border-radius: 12px; background: #000; display: block; margin: 8px 0 12px; }
  .eulogy .own { font-family: Georgia, "Times New Roman", serif; font-size: 18px; line-height: 1.75; margin: 0 0 1em; white-space: pre-wrap; overflow-wrap: anywhere; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button, .btn { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 9px 16px; font: inherit; font-size: 15px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 16px; }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .memory { border-top: 1px solid var(--line); padding: 16px 0; }
  .memory:first-child { border-top: 0; }
  .memory .body { white-space: pre-wrap; margin: 4px 0 0; }
  .media { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 10px; }
  .media img, .media video { width: 100%; border-radius: 10px; display: block; background: var(--line); }
  .media img { aspect-ratio: 4/3; object-fit: cover; cursor: zoom-in; }
  .media audio { width: 100%; grid-column: 1 / -1; }
  .media .item { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .media .item.wide { grid-column: 1 / -1; }
  button.small { padding: 5px 12px; font-size: 13px; align-self: flex-start; }
  .progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 10px 0; }
  .progress > div { height: 100%; background: var(--accent); width: 0; }
  ul.parts { list-style: none; padding: 0; margin: 10px 0; }
  ul.parts li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  input[type=email] { width: 100%; max-width: 360px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; }
  .err { color: var(--err); }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .hidden { display: none !important; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0 0 12px; }
  dt { color: var(--muted); } dd { margin: 0; }
  @media print { .no-print { display: none !important; } body { background: #fff; color: #000; } .card { border: 0; padding: 0; } }
</style>
</head>
<body>
<main>
  <div class="brand">DayCasion · Legacy</div>
  <div id="status" class="card"><p class="muted">Opening…</p></div>
  <div id="content" class="hidden">
    <h1 id="title"></h1>
    <p class="muted" id="subtitle"></p>
    <section class="card eulogy" id="eulogy"></section>
    <section class="card hidden" id="video-eulogy"></section>
    <section class="card hidden" id="materials">
      <h2>Shared memories</h2>
      <p class="muted">Read-only. Shared by <span id="owner-name"></span> with you alone.</p>
      <div class="chips no-print" id="profiles"></div>
      <div class="tabs no-print" id="tabs"></div>
      <div id="panel"></div>
      <div class="row no-print"><button id="more" class="hidden">Load more</button></div>
    </section>
    <section class="card hidden no-print" id="everything">
      <h2>Download Everything Shared</h2>
      <p class="muted">One download (a ZIP file, in several parts if it's large) of everything <span id="ev-name"></span> shared with you: the memories, photos, videos, recordings and Life Stories you can see here.</p>
      <div id="ev-body"><p class="muted">Loading…</p></div>
    </section>
    <p class="muted no-print" id="expiry" style="margin-top:20px"></p>
  </div>
</main>
<script>
(() => {
  "use strict";
  // Never show inside another site's frame (clickjacking); stay hidden and move to the top window without the link token.
  if (window.top !== window.self) {
    try { window.top.location.replace(location.origin + location.pathname); } catch (_) {}
    return;
  }
  document.getElementById("dc-frame-guard").remove();
  const API = location.pathname.includes("/functions/v1/legacy-access")
    ? location.origin + "/functions/v1/legacy-access"
    : "https://zwitjkrmzkvrektahuml.supabase.co/functions/v1/legacy-access";
  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "text") n.textContent = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
    }
    for (const k of kids) if (k) n.append(k);
    return n;
  };
  // The link's token is in the address fragment (never sent to any server log); keep it for this tab only.
  let token = "";
  const m = location.hash.match(/(?:^#|&)t=([0-9a-f]{64})/);
  if (m) { token = m[1]; try { sessionStorage.setItem("dcLegacyToken", token); } catch (_) {} history.replaceState(null, "", location.pathname + location.search); }
  else { try { token = sessionStorage.getItem("dcLegacyToken") || ""; } catch (_) {} }

  async function call(action, extra = {}) {
    const res = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, token, ...extra }) });
    let data = null; try { data = await res.json(); } catch (_) {}
    if (!res.ok) { const e = new Error((data && data.error) || "unavailable"); e.code = (data && data.error) || "unavailable"; throw e; }
    return data;
  }
  function status(...nodes) { $("content").classList.add("hidden"); const s = $("status"); s.classList.remove("hidden"); s.replaceChildren(...nodes); }
  function longDate(iso) { try { return new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" }); } catch (_) { return ""; } }

  function renewForm(message, withToken) {
    const note = el("p", { class: "muted", text: "" });
    const parts = [el("h2", { text: message.title }), el("p", { text: message.body })];
    if (withToken) {
      const b = el("button", { class: "primary", text: "Email me a new link", onclick: async () => {
        b.disabled = true;
        try { await call("renew"); note.textContent = "If this link belongs to you, a new one is on its way to your email."; } catch (_) { note.textContent = "Something went wrong. Please try again later."; b.disabled = false; }
      } });
      parts.push(el("div", { class: "row" }, b));
    } else {
      const input = el("input", { type: "email", placeholder: "Your email address", autocomplete: "email", "aria-label": "Your email address" });
      const b = el("button", { class: "primary", text: "Send me a link", onclick: async () => {
        b.disabled = true;
        try { await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "renew_email", email: input.value }) });
              note.textContent = "If that address belongs to a Legacy Executor, a new link is on its way."; } catch (_) { note.textContent = "Something went wrong. Please try again later."; }
        b.disabled = false;
      } });
      parts.push(el("div", { class: "row" }, input, b));
    }
    parts.push(note);
    status(...parts);
  }

  function showEulogy(d) {
    const box = $("eulogy");
    const e = d.eulogy || {};
    const textButton = (label) => el("button", { text: label, onclick: async () => {
      try {
        const r = await call("eulogy_download");
        const url = URL.createObjectURL(new Blob([r.text], { type: "text/plain;charset=utf-8" }));
        const a = el("a", { href: url, download: r.filename }); document.body.append(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      } catch (err) { handle(err); }
    } });
    const print = el("button", { text: "Print", onclick: () => window.print() });
    if (e.status === "ready" && e.kind === "completed") {
      // The owner's own finished eulogy, exactly as they wrote it (no AI), with their original document.
      const kinds = { pdf: "PDF", docx: "Word document", txt: "text file" };
      const original = el("button", { class: "primary", text: "Download the original " + (kinds[(e.document || {}).type] || "document"), onclick: async () => {
        try { const r = await call("eulogy_document"); startDownload(r.url); } catch (err) { handle(err); }
      } });
      const text = e.text_available && e.paragraphs && e.paragraphs.length ? e.paragraphs.map((p) => p.text).join("\n\n") : "";
      box.replaceChildren(el("h2", { text: "Eulogy" }),
        text ? el("div", { class: "own", text: text }) : el("p", { text: d.subject_name + " wrote their own eulogy. It is in the document below." }),
        el("div", { class: "row no-print" }, original, text ? textButton("Download as text") : null, text ? print : null),
        el("p", { class: "muted", text: "These are " + d.subject_name + "'s own words, exactly as they wrote them." }));
    } else if (e.status === "ready" && e.paragraphs && e.paragraphs.length) {
      box.replaceChildren(el("h2", { text: e.title || "Eulogy" }), ...e.paragraphs.map((p) => el("p", { text: p.text })),
        el("div", { class: "row no-print" }, textButton("Download"), print),
        el("p", { class: "muted", text: "This eulogy was thoughtfully written using AI, based only on what " + d.subject_name + " chose to share with DayCasion." }));
    } else if (e.status === "not_authorized" && d.video) {
      box.classList.add("hidden"); // only a video eulogy (shown below)
    } else if (e.status === "not_authorized") {
      box.replaceChildren(el("h2", { text: "Eulogy" }), el("p", { text: d.subject_name + " did not include a eulogy." }));
    } else if (e.status === "no_material") {
      box.replaceChildren(el("h2", { text: "Eulogy" }), el("p", { text: "There wasn't enough information to prepare a eulogy." }));
    } else {
      box.replaceChildren(el("h2", { text: "Eulogy" }), el("p", { class: "muted", text: "The eulogy isn't available yet. Please check back later." }));
    }
  }

  // ---- Video eulogy (the owner's own recording, exactly as uploaded; streamed, so playback starts at once)
  function clock(s) { s = Math.round(Number(s) || 0); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(r).padStart(2, "0"); }
  function showVideo(d) {
    if (!d.video) return;
    const box = $("video-eulogy"); box.classList.remove("hidden");
    const player = el("video", { controls: "", preload: "metadata", playsinline: "", "aria-label": "Video eulogy" });
    const note = el("p", { class: "err" });
    // Some browsers can't play every format (for example MOV files outside Safari): the download always works.
    player.addEventListener("error", () => { if (player.getAttribute("src")) { player.classList.add("hidden");
      note.className = "muted"; note.id = "video-cant-play"; note.textContent = "This browser can't play this video format. Use Download video to watch it on your device."; } });
    call("eulogy_video").then((r) => { player.src = r.url; }).catch((err) => {
      if (err.code === "link_expired" || err.code === "invalid_link") return handle(err);
      note.textContent = "The video isn't available right now. Please refresh the page or try again later."; });
    const dl = el("button", { text: "Download video", onclick: async () => {
      dl.disabled = true;
      try { const r = await call("eulogy_video", { download: true }); startDownload(r.url); }
      catch (err) { if (err.code === "link_expired" || err.code === "invalid_link") return handle(err); note.textContent = "The download isn't available right now. Please try again later."; }
      dl.disabled = false;
    } });
    const facts = [d.video.duration_seconds ? clock(d.video.duration_seconds) : null, d.video.size_bytes ? sizeText(d.video.size_bytes) : null].filter(Boolean).join(" · ");
    box.replaceChildren(el("h2", { text: "Video eulogy" }),
      el("p", { class: "muted", text: d.subject_name + " recorded this video for you." + (facts ? " " + facts + "." : "") }),
      player, el("div", { class: "row no-print" }, dl), note,
      el("p", { class: "muted", text: "This is " + d.subject_name + "'s own video, exactly as they uploaded it. Large videos download best on a computer." }));
  }

  let current = { profile: null, tab: null, offset: 0 };
  function setupMaterials(d) {
    if (d.access_level !== "full_access" || !d.profiles.length) return;
    $("materials").classList.remove("hidden");
    $("owner-name").textContent = d.subject_name;
    const tabs = [];
    if (d.materials.some((x) => ["memories", "photos", "videos", "voice"].includes(x))) tabs.push(["memories", "Memories"]);
    if (d.materials.includes("life_story")) tabs.push(["life_story", "Life Story"]);
    const chips = d.profiles.map((p) => el("button", { class: "chip", "aria-pressed": "false", text: p.name || "Profile", onclick: () => select(p.id, current.tab) }));
    $("profiles").replaceChildren(...chips);
    $("profiles").dataset.ids = d.profiles.map((p) => p.id).join(",");
    $("tabs").replaceChildren(...tabs.map(([k, label]) => el("button", { class: "chip", "data-tab": k, "aria-pressed": "false", text: label, onclick: () => select(current.profile, k) })));
    if (tabs.length < 2) $("tabs").classList.add("hidden");
    select(d.profiles[0].id, tabs[0] ? tabs[0][0] : null);
  }
  function select(profile, tab) {
    current = { profile, tab, offset: 0 };
    const ids = ($("profiles").dataset.ids || "").split(",");
    [...$("profiles").children].forEach((c, i) => c.setAttribute("aria-pressed", String(ids[i] === profile)));
    [...$("tabs").children].forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.tab === tab)));
    $("panel").replaceChildren(el("p", { class: "muted", text: "Loading…" }));
    $("more").classList.add("hidden");
    if (tab === "life_story") loadLifeStory(); else if (tab) loadMemories(true);
  }
  // Every download asks the server again (the private link, the owner's sharing choices and the file are re-checked).
  function startDownload(url) { const a = el("a", { href: url, rel: "noopener" }); document.body.append(a); a.click(); a.remove(); }
  function saveText(name, text) {
    const url = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));
    const a = el("a", { href: url, download: name }); document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  function downloadButton(mediaId) {
    const b = el("button", { class: "small no-print", text: "Download", onclick: async () => {
      b.disabled = true;
      try { const r = await call("media_download", { media_id: mediaId }); startDownload(r.url); }
      catch (err) { if (err.code === "link_expired" || err.code === "invalid_link") return handle(err); b.textContent = "Not available"; return; }
      b.disabled = false;
    } });
    return b;
  }
  function mediaNode(x) {
    let n = null;
    if (x.kind === "photo") n = el("img", { src: x.preview, alt: "Photo", loading: "lazy", onclick: () => {
      const lb = el("div", { class: "lightbox", onclick: () => lb.remove() }, el("img", { src: x.url, alt: "Photo" })); document.body.append(lb); } });
    else if (x.kind === "video") n = el("video", { src: x.url, controls: "", preload: "metadata", playsinline: "" });
    else if (x.kind === "audio") n = el("audio", { src: x.url, controls: "", preload: "none" });
    if (!n) return null;
    return el("div", { class: "item" + (x.kind === "audio" ? " wide" : "") }, n, x.id ? downloadButton(x.id) : null);
  }
  async function loadMemories(first) {
    try {
      const r = await call("memories", { profile_id: current.profile, offset: current.offset });
      const items = r.items.map((it) => {
        const media = it.media.map(mediaNode).filter(Boolean);
        const textButton = (it.title || it.body) ? el("button", { class: "small no-print", text: "Download text", onclick: () => {
          const name = ((it.date || "Undated") + " - " + (it.title || "Memory")).replace(/[^\p{L}\p{N} .,'-]/gu, "").slice(0, 80).trim() + ".txt";
          saveText(name, [it.title || "", it.date || "", "", it.body || ""].join("\n").trim() + "\n");
        } }) : null;
        return el("article", { class: "memory" },
          it.date ? el("div", { class: "muted", text: it.date }) : null,
          it.title ? el("h3", { text: it.title }) : null,
          it.body ? el("p", { class: "body", text: it.body }) : null,
          media.length ? el("div", { class: "media" }, ...media) : null,
          textButton ? el("div", { class: "row", style: "margin-top:8px" }, textButton) : null);
      });
      if (first) $("panel").replaceChildren(...(items.length ? items : [el("p", { class: "muted", text: "Nothing has been shared from this profile." })]));
      else $("panel").append(...items);
      current.offset = r.next_offset || 0;
      const more = $("more");
      more.classList.toggle("hidden", r.next_offset == null);
      more.onclick = () => loadMemories(false);
    } catch (err) { handle(err); }
  }
  async function loadLifeStory() {
    try {
      const r = await call("life_story", { profile_id: current.profile });
      const ls = r.life_story;
      if (!ls) { $("panel").replaceChildren(el("p", { class: "muted", text: "There is no Life Story for this profile." })); return; }
      const facts = [["Name", ls.full_name], ["Known as", ls.preferred_name], ["Relationship", ls.relationship], ["Born", ls.born], ["Birthplace", ls.birthplace],
                     ...ls.details.map((x) => [x.label.charAt(0).toUpperCase() + x.label.slice(1), x.value])].filter(([, v]) => v);
      const dl = el("dl", {}, ...facts.flatMap(([k, v]) => [el("dt", { text: k }), el("dd", { text: v })]));
      const chapters = ls.chapters.map((c) => el("article", { class: "memory" }, el("h3", { text: c.title }),
        el("div", { class: "muted", text: c.memory_count + (c.memory_count === 1 ? " memory" : " memories") }),
        c.memories ? el("ul", {}, ...c.memories.map((m) => el("li", { text: (m.date ? m.date + " · " : "") + (m.title || "Untitled memory") }))) : null));
      $("panel").replaceChildren(dl, ...chapters);
    } catch (err) { handle(err); }
  }

  // ---- Download Everything Shared ----
  function sizeText(b) { b = Number(b) || 0; if (b >= 1073741824) return (b / 1073741824).toFixed(1) + " GB"; if (b >= 1048576) return Math.round(b / 1048576) + " MB"; return Math.max(1, Math.ceil(b / 1024)) + " KB"; }
  let evTimer = null;
  function setupEverything(d) {
    if (d.access_level !== "full_access" || !d.profiles.length) return;
    $("everything").classList.remove("hidden");
    $("ev-name").textContent = d.subject_name;
    loadEverything();
  }
  async function loadEverything() {
    clearTimeout(evTimer);
    let r;
    try { r = await call("export_status"); } catch (err) { if (err.code === "link_expired" || err.code === "invalid_link") return handle(err);
      $("ev-body").replaceChildren(el("p", { class: "err", text: "This isn't available right now. Please try again later." })); return; }
    const x = r.export; const nodes = [];
    const note = el("p", { class: "err" });
    const requestButton = (label) => el("button", { class: "primary", text: label, onclick: async (ev) => {
      ev.target.disabled = true; note.textContent = "";
      try { await call("export_request"); loadEverything(); }
      catch (err) { if (err.code === "link_expired" || err.code === "invalid_link") return handle(err);
        ev.target.disabled = false; note.textContent = err.code === "export_limit" ? "You've reached the limit of downloads for now. Please try again later." : "That didn't work. Please try again later."; }
    } });
    if (x && (x.status === "queued" || x.status === "processing")) {
      const p = x.progress || {}; const ft = Number(p.files_total) || 0, fd = Number(p.files_done) || 0, bt = Number(p.bytes_total) || 0, bd = Number(p.bytes_done) || 0;
      const frac = p.phase === "verifying" ? 1 : bt > 0 ? bd / bt : ft > 0 ? fd / ft : 0;
      nodes.push(el("p", { text: x.status === "queued" && x.attempts > 0 ? "We hit a temporary problem and will try again automatically. Anything already prepared is kept."
        : x.status === "queued" ? "Getting ready to start. Large downloads can take a few hours."
        : ft > 0 ? "Preparing " + fd.toLocaleString() + " of " + ft.toLocaleString() + " files…" : "Preparing your download…" }));
      const bar = el("div", { class: "progress" }, el("div")); bar.firstChild.style.width = Math.max(2, Math.round(frac * 100)) + "%"; nodes.push(bar);
      nodes.push(el("p", { class: "muted", text: "We'll email you when it's ready, so you don't need to keep this page open." }));
      evTimer = setTimeout(loadEverything, 30000);
    } else if (x && x.status === "ready") {
      const n = x.parts.length;
      nodes.push(el("p", { text: "Ready · " + sizeText(x.total_bytes) + (n > 1 ? " in " + n + " parts" : "") + " · available until " + longDate(x.expires_at) }));
      nodes.push(el("ul", { class: "parts" }, ...x.parts.map((p) => {
        const b = el("button", { class: "primary", text: n > 1 ? "Download part " + p.part : "Download", onclick: async () => {
          b.disabled = true;
          try { const r2 = await call("export_part_link", { job_id: x.job_id, part: p.part }); startDownload(r2.url); }
          catch (err) { if (err.code === "link_expired" || err.code === "invalid_link") return handle(err); note.textContent = "This file isn't available any more. Refresh the page to check."; }
          b.disabled = false;
        } });
        return el("li", {}, el("span", { text: (n > 1 ? "Part " + p.part + " of " + n : "Your download") + " · " + sizeText(p.bytes) }), b);
      })));
      nodes.push(el("p", { class: "muted", text: (n > 1 ? "Download every part and extract them all into the same folder, then open index.html in a web browser on your computer."
        : "Extract the ZIP file, then open index.html in a web browser on your computer.")
        + " We recommend a computer for large downloads. For privacy, this download is deleted after 7 days." }));
    } else {
      if (x && x.status === "expired") nodes.push(el("p", { class: "muted", text: "Your last download has expired and was deleted for privacy." }));
      if (x && x.status === "failed") nodes.push(el("p", { class: "err", text: "We couldn't prepare your last download. Our support team has been alerted." }));
      if (r.can_request) nodes.push(el("div", { class: "row" }, requestButton(x ? "Prepare a new download" : "Prepare my download")));
      else if (r.next_request_at) nodes.push(el("p", { class: "muted", text: "You can request up to " + r.requests_allowed + " downloads every 30 days. You can request another on " + longDate(r.next_request_at) + "." }));
      nodes.push(el("p", { class: "muted", text: "We'll prepare it and email you when it's ready. Large downloads can take a few hours." }));
    }
    nodes.push(note);
    $("ev-body").replaceChildren(...nodes);
  }

  function handle(err) {
    if (err.code === "link_expired") return renewForm({ title: "This link has expired", body: "For your security, legacy links expire. We can email a new one to the address on file." }, true);
    if (err.code === "invalid_link") return renewForm({ title: "This link isn't valid", body: "If you are a DayCasion Legacy Executor, enter your email address and we'll send you a new link." }, false);
    status(el("p", { class: "err", text: "Something went wrong. Please refresh the page or try again later." }));
  }

  async function start() {
    if (!token) return renewForm({ title: "Open your legacy link", body: "Use the private link in your email from DayCasion. If you've lost it, enter your email address and we'll send a new one." }, false);
    try {
      const d = await call("overview");
      $("status").classList.add("hidden");
      $("content").classList.remove("hidden");
      $("title").textContent = "In memory of " + d.subject_name;
      const hasEulogy = (d.eulogy && d.eulogy.status === "ready") || !!d.video;
      const full = d.access_level === "full_access" && d.profiles.length;
      $("subtitle").textContent = hasEulogy && full ? "A eulogy and memories shared with you by " + d.subject_name + "."
        : full ? "Memories shared with you by " + d.subject_name + "."
        : hasEulogy ? "A eulogy shared with you by " + d.subject_name + "."
        : d.subject_name + " named you as their DayCasion Legacy Executor.";
      document.title = "In memory of " + d.subject_name;
      showEulogy(d);
      showVideo(d);
      setupMaterials(d);
      setupEverything(d);
      $("expiry").textContent = "This private link is for you alone. It expires on " + longDate(d.link_expires_at) + "; you can request a new link any time.";
    } catch (err) { handle(err); }
  }
  start();
})();
</script>
</body>
</html>
